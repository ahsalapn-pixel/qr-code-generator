
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>QR Code Generator</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        :root {
            --bg: linear-gradient(135deg, #667eea, #764ba2);
            --card: rgba(255, 255, 255, 0.96);
            --text: #111827;
            --secondary: #6b7280;
            --input: #ffffff;
            --border: #e5e7eb;
            --option: #f9fafb;
        }

        body.dark {
            --bg: linear-gradient(135deg, #111827, #312e81);
            --card: #1f2937;
            --text: #f9fafb;
            --secondary: #9ca3af;
            --input: #374151;
            --border: #4b5563;
            --option: #374151;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            background: var(--bg);
            color: var(--text);
            transition: 0.3s;
        }

        .container {
            width: 450px;
            max-width: 100%;
            padding: 30px;
            background: var(--card);
            border-radius: 25px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.25);
            position: relative;
        }

        .theme-btn {
            position: absolute;
            right: 20px;
            top: 20px;
            width: 40px;
            height: 40px;
            border: none;
            border-radius: 50%;
            cursor: pointer;
            background: var(--option);
            color: var(--text);
            font-size: 18px;
        }

        .icon {
            width: 65px;
            height: 65px;
            margin: 10px auto 15px;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #111827;
            color: white;
            border-radius: 18px;
            font-size: 30px;
        }

        h1 {
            text-align: center;
            font-size: 28px;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: var(--secondary);
            font-size: 14px;
            margin-bottom: 25px;
        }

        .input-group {
            margin-bottom: 8px;
        }

        .input-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        label {
            font-size: 14px;
            font-weight: bold;
        }

        #counter {
            font-size: 12px;
            color: var(--secondary);
        }

        textarea {
            width: 100%;
            height: 90px;
            resize: none;
            padding: 14px;
            border: 2px solid var(--border);
            border-radius: 12px;
            outline: none;
            font-size: 15px;
            background: var(--input);
            color: var(--text);
            transition: 0.3s;
        }

        textarea:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.15);
        }

        #errorMessage {
            color: #ef4444;
            font-size: 13px;
            margin: 7px 0 15px;
            display: none;
        }

        .copy-btn {
            width: 100%;
            margin-top: 10px;
            padding: 10px;
            border: none;
            border-radius: 10px;
            background: #e5e7eb;
            color: #374151;
            cursor: pointer;
            font-weight: bold;
        }

        .copy-btn:hover {
            background: #d1d5db;
        }

        .options {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-top: 18px;
        }

        .option {
            padding: 12px;
            background: var(--option);
            border-radius: 12px;
        }

        .option label {
            display: block;
            font-size: 12px;
            margin-bottom: 7px;
        }

        select {
            width: 100%;
            padding: 9px;
            border: 1px solid var(--border);
            border-radius: 8px;
            outline: none;
            background: var(--input);
            color: var(--text);
        }

        .colors {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 15px;
    margin: 20px 0;
}

.color-box {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 12px;
    background: var(--option);
    border-radius: 10px;
    font-size: 14px;
}

.color-box span {
    white-space: nowrap;
}

input[type="color"] {
    width: 42px;
    height: 32px;
    padding: 0;
    border: 1px solid var(--border);
    border-radius: 6px;
    cursor: pointer;
    background: transparent;
}

        .buttons {
            display: flex;
            gap: 10px;
        }

        .generate-btn,
        .clear-btn {
            flex: 1;
            padding: 13px;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            font-size: 15px;
            font-weight: bold;
        }

        .generate-btn {
            background: #111827;
            color: white;
        }

        .generate-btn:hover {
            transform: translateY(-2px);
        }

        .clear-btn {
            background: #e5e7eb;
            color: #374151;
        }

        .clear-btn:hover {
            background: #d1d5db;
        }

        #qrCode {
            margin-top: 25px;
            min-height: 200px;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            background: white;
            border-radius: 15px;
            border: 2px dashed var(--border);
        }

        #qrCode img,
        #qrCode canvas {
            max-width: 100%;
        }

        .download-btn {
            width: 100%;
            margin-top: 15px;
            padding: 13px;
            border: none;
            border-radius: 12px;
            background: #667eea;
            color: white;
            cursor: pointer;
            font-size: 15px;
            font-weight: bold;
            display: none;
        }

        .download-btn:hover {
            background: #5568d9;
        }

        .hint {
            text-align: center;
            margin-top: 15px;
            font-size: 12px;
            color: var(--secondary);
        }

        @media (max-width: 500px) {
            body {
                padding: 10px;
            }

            .container {
                padding: 25px 18px;
            }

            .options {
                grid-template-columns: 1fr;
            }

            .colors {
                gap: 15px;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <button
            class="theme-btn"
            id="themeBtn"
            onclick="toggleTheme()">
            🌙
        </button>

        <div class="icon">
            ▦
        </div>

        <h1>QR Code Generator</h1>

        <p class="subtitle">
            Create QR codes for text, links and messages
        </p>

        <div class="input-group">

            <div class="input-header">

                <label>Text or URL</label>

                <span id="counter">
                    0 / 1000
                </span>

            </div>

            <textarea
                id="textInput"
                maxlength="1000"
                placeholder="Enter text or URL here..."
                oninput="handleInput()"></textarea>

        </div>

        <div id="errorMessage">
            Please enter some text or a URL.
        </div>

        <button
            class="copy-btn"
            onclick="copyText()">
             Copy Text
        </button>

        <div class="options">

            <div class="option">

                <label> QR Size</label>

                <select
                    id="qrSize"
                    onchange="generateQRCode()">

                    <option value="150">
                        Small — 150px
                    </option>

                    <option value="200" selected>
                        Medium — 200px
                    </option>

                    <option value="250">
                        Large — 250px
                    </option>

                    <option value="300">
                        Extra Large — 300px
                    </option>

                </select>

            </div>

            <div class="option">

                <label> Error Correction</label>

                <select
                    id="errorLevel"
                    onchange="generateQRCode()">

                    <option value="L">
                        Low
                    </option>

                    <option value="M" selected>
                        Medium
                    </option>

                    <option value="Q">
                        High
                    </option>

                    <option value="H">
                        Very High
                    </option>

                </select>

            </div>

        </div>

        <div class="colors">

            <div class="color-box">

                <span> QR Color</span>

                <input
                    type="color"
                    id="darkColor"
                    value="#000000"
                    onchange="generateQRCode()">

            </div>

            <div class="color-box">

                <span>Background Color</span>

                <input
                    type="color"
                    id="lightColor"
                    value="#ffffff"
                    onchange="generateQRCode()">

            </div>

        </div>

        <div class="buttons">

            <button
                class="generate-btn"
                onclick="generateQRCode()">
                Generate QR
            </button>

            <button
                class="clear-btn"
                onclick="clearQR()">
                 Clear
            </button>

        </div>

        <div id="qrCode">

            <span
                style="color:#9ca3af;font-size:14px;">
                Your QR code will appear here
            </span>

        </div>

        <button
            id="downloadBtn"
            class="download-btn"
            onclick="downloadQR()">
            ⬇ Download QR as PNG
        </button>

        <p class="hint">
            Enter text or a URL and your QR code will generate automatically.
        </p>

    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

    <script>

        const textInput =
            document.getElementById("textInput");

        const counter =
            document.getElementById("counter");

        const qrCodeContainer =
            document.getElementById("qrCode");

        const errorMessage =
            document.getElementById("errorMessage");

        const downloadBtn =
            document.getElementById("downloadBtn");


        function handleInput() {

            const text = textInput.value;

            counter.textContent =
                text.length + " / 1000";

            if (text.trim() !== "") {

                errorMessage.style.display = "none";

                generateQRCode();

            } else {

                qrCodeContainer.innerHTML =
                    '<span style="color:#9ca3af;font-size:14px;">Your QR code will appear here</span>';

                downloadBtn.style.display = "none";
            }
        }


        function generateQRCode() {

            const text =
                textInput.value.trim();

            if (text === "") {

                errorMessage.style.display = "block";

                qrCodeContainer.innerHTML =
                    '<span style="color:#9ca3af;font-size:14px;">Your QR code will appear here</span>';

                downloadBtn.style.display = "none";

                return;
            }

            errorMessage.style.display = "none";

            const size =
                Number(
                    document.getElementById("qrSize").value
                );

            const darkColor =
                document.getElementById("darkColor").value;

            const lightColor =
                document.getElementById("lightColor").value;

            const errorLevel =
                document.getElementById("errorLevel").value;

            qrCodeContainer.innerHTML = "";

            new QRCode(
                qrCodeContainer,
                {
                    text: text,
                    width: size,
                    height: size,
                    colorDark: darkColor,
                    colorLight: lightColor,
                    correctLevel:
                        QRCode.CorrectLevel[errorLevel]
                }
            );

            downloadBtn.style.display = "block";
        }


        async function copyText() {

            const text =
                textInput.value.trim();

            if (text === "") {

                errorMessage.style.display = "block";

                return;
            }

            try {

                await navigator.clipboard.writeText(text);

                alert("Text copied successfully!");

            } catch (error) {

                alert("Unable to copy text.");
            }
        }


        function clearQR() {

            textInput.value = "";

            counter.textContent = "0 / 1000";

            errorMessage.style.display = "none";

            qrCodeContainer.innerHTML =
                '<span style="color:#9ca3af;font-size:14px;">Your QR code will appear here</span>';

            downloadBtn.style.display = "none";
        }


        function downloadQR() {

            const qrImage =
                document.querySelector("#qrCode img");

            if (!qrImage) {

                alert("Generate a QR code first!");

                return;
            }

            const link =
                document.createElement("a");

            link.href = qrImage.src;

            link.download =
                "my-qr-code.png";

            link.click();
        }


        function toggleTheme() {

            document.body.classList.toggle("dark");

            const isDark =
                document.body.classList.contains("dark");

            document.getElementById("themeBtn").textContent =
                isDark ? "☀️" : "🌙";

            localStorage.setItem(
                "theme",
                isDark ? "dark" : "light"
            );
        }


        const savedTheme =
            localStorage.getItem("theme");

        if (savedTheme === "dark") {

            document.body.classList.add("dark");

            document.getElementById("themeBtn").textContent =
                "☀️";
        }

    </script>

</body>

</html>
